# Install as /etc/systemd/system/rerime-release-watch.service.d/github-app.conf
# Only after provisioning both protected credentials; leave PAT intact for rollback.
[Unit]
ConditionPathExists=
ConditionPathExists=/etc/rerime-release-watch/github-app.json
ConditionPathExists=/etc/rerime-release-watch/github-app.pem

[Service]
LoadCredential=
LoadCredential=github-app.json:/etc/rerime-release-watch/github-app.json
LoadCredential=github-app.pem:/etc/rerime-release-watch/github-app.pem
