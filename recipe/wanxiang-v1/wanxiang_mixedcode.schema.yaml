schema:
  schema_id: wanxiang_mixedcode
  name: 万象混合编码
  version: '1.0'
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [table_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
  algebra:
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ/aaaaooooeeeeiiiiuuuuvvvvvnnn/
    - xform/'//
    - derive/^.+$/\L$0/
    - derive/^.+$/\U$0/
translator:
  dictionary: wanxiang_mixedcode
  enable_user_dict: true
  enable_sentence: false
  enable_completion: true
