schema:
  schema_id: wanxiang_english
  name: 万象英文
  version: '1.0'
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [table_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
  algebra:
    - derive/^.+$/\L$0/
    - derive/^.+$/\U$0/
    - derive/^./\U$0/
translator:
  dictionary: wanxiang_english
  user_dict: wanxiang_english
  enable_user_dict: true
  enable_completion: true
  enable_sentence: false
  comment_format: ["xform/.*//"]
