# ReRime nine-key (T9) adaptation of Wanxiang. CC BY 4.0; see NOTICE.md.
# Speller algebra: upstream wanxiang_t9.schema.yaml at the pinned revision
# 64c9c8c10524c5a354a62ef92fa4ad3187b16bc5 (locks/source.json), without its
# commented-out abbreviation rules. No Lua, grammar or abbreviation tables.
schema:
  schema_id: wanxiang_t9
  name: 万象九键
  version: '1.0'
  author:
    - amzxyz (Wanxiang T9 spelling rules, CC BY 4.0)
  description: ReRime nine-key adaptation of the Wanxiang T9 speller over the shared wanxiang dictionary.
switches:
  - name: ascii_mode
    reset: 0
  - name: traditionalization
    reset: 0
  - name: emoji
    reset: 1
engine:
  processors: [ascii_composer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator, table_translator@personal_t9]
  filters: [simplifier@emoji, simplifier@traditionalize, uniquifier]
menu:
  page_size: 9
  # Digits must reach the speller; ReRime selects candidates through the API.
  alternative_select_keys: ABCDEFGHI
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz23456789
  initials: abcdefghijklmnopqrstuvwxyz23456789
  delimiter: " '"
  algebra:
    - xform/ⅱ//
    - xform/^(.*);.*$/$1/
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ/aaaaooooeeeeiiiiuuuuvvvvvnnn/
    - xform/ḿ/me/
    - xform/m̀/me/
    - derive/^ng$/eng/
    - xform/^n$/en/
    - derive/^(.*)$/\U$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([NL])VE$/$1UE/
    - derive/ong$/on/
    - derive/iong$/ion/
    - derive/ONG$/ON/
    - derive/IONG$/ION/
    - derive/^([jqxy])u/$1v/
    - derive/^([JQXY])U/$1V/
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/22233344455566677778889999/
translator:
  dictionary: wanxiang
  prism: wanxiang_t9
  initial_quality: 1.2
  enable_user_dict: true
  enable_completion: true
  enable_sentence: false
  enable_correction: false
  # Each comment carries the candidate's toneless spelling, e.g. "ni hao".
  spelling_hints: 50
  always_show_comments: true
  comment_format:
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜüńňǹ/aaaaooooeeeeiiiiuuuuvvvvvnnn/
    - xform/ḿ/me/
    - xform/m̀/me/
    - xform/\bn\b/en/
personal_t9:
  dictionary: ''
  user_dict: rerime_personal_t9
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 100
emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false
traditionalize:
  excluded_types: [punct]
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none
key_binder:
  import_preset: default
punctuator:
  half_shape:
    ',': {commit: '，'}
    '.': {commit: '。'}
    '?': {commit: '？'}
    '!': {commit: '！'}
    ':': {commit: '：'}
    ';': {commit: '；'}
  full_shape:
    ',': {commit: '，'}
    '.': {commit: '。'}
